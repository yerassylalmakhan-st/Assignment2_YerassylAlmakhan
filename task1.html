<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 1 - Mondrian Composition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f0f0;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 10px; /* Черные линии формируются через gap */
      background-color: #000;
      width: 90vw;
      height: 90vw;
      max-width: 90vh;
      max-height: 90vh;
    }
    .block {
      background-color: #f2f2f2;
    }
    .blue   { background-color: #1a4ba0; grid-column: 1 / 3; grid-row: 1 / 4; }
    .top-w  { background-color: #f2f2f2; grid-column: 3 / 7; grid-row: 1 / 2; }
    .yellow { background-color: #f7d000; grid-column: 3 / 5; grid-row: 2 / 4; }
    .white1 { background-color: #f2f2f2; grid-column: 5 / 7; grid-row: 2 / 5; }
    .red    { background-color: #d02020; grid-column: 1 / 4; grid-row: 4 / 7; }
    .black  { background-color: #1a1a1a; grid-column: 4 / 5; grid-row: 4 / 7; }
    .white2 { background-color: #f2f2f2; grid-column: 5 / 7; grid-row: 5 / 7; }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="block blue"></div>
    <div class="block top-w"></div>
    <div class="block yellow"></div>
    <div class="block white1"></div>
    <div class="block red"></div>
    <div class="block black"></div>
    <div class="block white2"></div>
  </div>
</body>
</html>
